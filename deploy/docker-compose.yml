services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: acervo-catolico-api
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      CORS_ORIGINS: '["https://compendio-catolico.com","https://www.compendio-catolico.com"]'
    expose:
      - "8000"
    networks:
      - proxy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  proxy:
    external: true
    name: deploy_default
