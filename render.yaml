# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: conecte este repositório no Render (New > Blueprint) e ele lê
# este arquivo sozinho. `sync: false` nas variáveis abaixo significa "não
# tem valor padrão seguro, preencha no dashboard" — nunca um segredo ou
# uma origem de CORS de verdade fica commitado aqui.
services:
  - type: web
    name: acervo-catolico-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        # Formato exato (pydantic-settings espera JSON, não CSV):
        # ["https://SEU-PROJETO.vercel.app"]
        # Preencha DEPOIS de saber a URL do frontend no Vercel — ver
        # DEPLOY.md, "Ordem de deploy".
        sync: false
      - key: DATABASE_URL
        # Opcional — string de conexão Postgres do mural de velas (ex.:
        # Neon). Sem ela, a API sobe normalmente e só /api/velas responde
        # 503. Ver DEPLOY.md, "Mural de velas".
        sync: false
      - key: IMAGE_CDN_BASE_URL
        # Opcional — URL pública do bucket/CDN que publica os assets em
        # app/static/img-acervo/ (ver docs/imagens/04-operacao-e-publicacao.md).
        # Sem ela, a API serve a URL editorial original (Wikimedia). O
        # manifesto (app/data/image-manifest.json) é versionado no Git —
        # só os arquivos .webp em si vivem no bucket.
        sync: false
